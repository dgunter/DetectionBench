[project]
name = "detectionbench-backend"
version = "0.1.0"
description = "DetectionBench API: deterministic Sigma rule evaluation with an AI second opinion"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pysigma>=1.5.0",
    "pyyaml>=6",
    "pydantic>=2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
