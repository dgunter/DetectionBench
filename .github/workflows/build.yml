name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# The workflow token only needs to read the repo and write the sticky
# SonarCloud comment on the PR (issues API). Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  sonarqube:
    name: Tests + SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # Backend: pytest with coverage. SonarCloud reads backend/coverage.xml
      # (sonar.python.coverage.reportPaths), so coverage is visible, not zero.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Backend tests
        working-directory: backend
        run: uv run --frozen pytest -q --cov=app --cov-report=xml:coverage.xml

      # Frontend: type gate + the pure-function unit tests.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck + tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --silent
          npm run typecheck
          npx vitest run --coverage
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      # Push to main -> branch analysis; pull_request -> PR analysis
      # (the scanner auto-detects the PR number from the Actions event and
      # scores only the new code against main).
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Bring the PR analysis back into GitHub: wait for SonarCloud to finish
      # processing, then upsert one sticky comment (quality gate + every open
      # issue on the new code, plus a JSON copy), annotate the diff, and
      # mirror it into the job summary. Report-only by default; set
      # SONAR_GATE_FAILS_JOB=true to turn a red gate into a red check.
      - name: Post SonarCloud results to the PR
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/sonar_pr_report.py
