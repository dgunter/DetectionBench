sonar.projectKey=dgunter_DetectionBench
sonar.organization=dgunter

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=DetectionBench
sonar.projectVersion=0.1

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.min.js,**/coverage/**,**/.idea/**,**/.github/**

# Test sources are scanned separately so SonarCloud reports coverage/test metrics correctly
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test_*.py,**/*_test.py,**/conftest.py
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/.venv/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# TypeScript/JS and Python are auto-detected once frontend/ and backend/ land.
# Interpreter pinned to 3.14 (matches local uv env and the production host).
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
# Frontend: vitest writes lcov (see the CI step); without it every .ts file scores 0%.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
